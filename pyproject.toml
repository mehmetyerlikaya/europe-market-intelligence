[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "europe-market-intelligence"
version = "0.1.0"
description = "A reproducible Eurostat and public-holiday market data pipeline"
requires-python = ">=3.12"
dependencies = ["duckdb>=1.2,<2", "PyYAML>=6,<7", "truststore>=0.10,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
app = ["streamlit>=1.50,<2", "pandas>=2.2,<4"]

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".local"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
